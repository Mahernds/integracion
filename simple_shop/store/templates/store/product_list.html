{% extends 'store/base.html' %}

{% block title %}Productos - {{ block.super }}{% endblock %}

{% block content %}
<h2 class="mb-4">Productos</h2>
<div class="row">
  {% for product in products %}
    <div class="col-md-3 mb-4">
      <div class="card h-100">
        <img src="{{ product.photo_url }}" class="card-img-top product-img" alt="{{ product.nombre }}">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.nombre }}</h5>
          <p class="card-text mb-2">${{ product.price|floatformat:0 }}</p>
          <button class="btn btn-danger btn-sm mt-auto agregar-carrito-btn w-100"
                  data-id="{{ product.id }}"
                  data-nombre="{{ product.nombre }}"
                  data-precio="{{ product.price|floatformat:0 }}"
                  data-imagen="{{ product.photo_url }}">
            Agregar al carrito
          </button>
        </div>
      </div>
    </div>
  {% empty %}
    <div class="col-12">
      <div class="alert alert-info text-center">
        No hay productos disponibles.
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
