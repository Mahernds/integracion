{% extends 'store/base.html' %}

{% block title %}Login - {{ block.super }}{% endblock %}

{% block content %}
<h2>Login</h2>
{% if form.errors %}
    <p class="errorlist">Your username and password didn't match. Please try again.</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
{% endblock %}
