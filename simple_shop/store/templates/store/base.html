<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Simple Shop{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        nav a { margin-right: 15px; text-decoration: none; }
        .product { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; width: 200px; float: left; margin-right: 10px;}
        .product img { max-width: 100%; height: auto; }
        .errorlist { color: red; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'product_list' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'add_product' %}">Add Product</a>
            <form action="{% url 'logout' %}" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
            <span>Hi {{ user.username }}!</span>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
    </nav>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
